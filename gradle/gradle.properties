# This file is auto-read by settings.gradle
# Use bnd released version
bnd_version=7.4.0
bnd_snapshots=https://bndtools.jfrog.io/bndtools/libs-snapshot/

# Use local SNAPSHOT Builds (for bnd developers)
# If you are a bnd developer and want to run a gradle build against your just built bnd changes, then
# point this to your local /dist/bundles folder of bnd repo
# and the run build and install commands (see https://github.com/bndtools/bnd/blob/master/CONTRIBUTING.md#build-environment)
# e.g. ./gradlew build -x test -x testOSGi
# and ./gradlew publish
# 
# Assuming your local version is 7.6.0-SNAPSHOT 
# then the settings below will build against this
#bnd_version=7.6.0-SNAPSHOT
#bnd_snapshots=/path/to/local/bnd/dist/bundles/

# Gradle Build Debugging
# Uncomment below if you want to debug a gradle build
# Note: suspend=y will wait until you attach a Eclipse remote-debugger to port 5006
# and will continue once the debugger connects and breakpoints are hit.
# org.gradle.daemon=true
# org.gradle.jvmargs=-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=5006
