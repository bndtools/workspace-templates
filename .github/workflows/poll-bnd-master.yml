name: Poll bnd master

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: poll-bnd-master
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a testbed run for a new bnd master revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/bndtools/bnd/commits/master --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid bnd master SHA: $sha"
            exit 1
          fi
          previous="$(gh run list --repo "$TARGET_REPOSITORY" \
            --workflow bnd-master.yml --event workflow_dispatch \
            --branch "$TARGET_REF" --limit 1 --json displayTitle \
            --jq '.[0].displayTitle // ""')"
          if [[ "$previous" == "bnd master $sha" ]]; then
            echo "bnd master $sha already dispatched; no new run needed."
            exit 0
          fi
          gh workflow run bnd-master.yml --repo "$TARGET_REPOSITORY" \
            --ref "$TARGET_REF" -f "bnd_sha=$sha"
          echo "Dispatched workspace-templates tests for bnd master $sha."
